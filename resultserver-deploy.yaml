apiVersion: apps/v1
kind: Deployment
metadata:
  name: resultserver-deploy
spec:
  replicas: 1
  selector:
    matchLabels:
       app: resultserver
  template: 
    metadata:
      labels:
        app: resultserver
    spec:
      containers:
      - name: resultserver-container
        image: ramznagc/result-server:1.0.1
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        envFrom:
        - configMapRef:
            name: servers-configmap
        - secretRef:
            name: shared-secret
          